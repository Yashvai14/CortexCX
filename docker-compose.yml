services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cortexcx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cortexcx_db
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cortexcx_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: cortexcx-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Use the NVIDIA GPU when the host has one (CPU inference is ~10x slower). Requires the NVIDIA driver and
    # Docker Desktop's WSL2 GPU support; remove this block to run on CPU only.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortexcx-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    env_file:
      - ./backend/.env
    command: >
      sh -c "alembic upgrade head &&
             python scripts/bootstrap_docker.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/cortexcx_db
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  telegram-bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cortexcx-telegram-bot
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - ./backend/.env
    command: >
      sh -c "if [ -n \"$$TELEGRAM_BOT_TOKEN\" ]; then
               python scripts/run_telegram_bot.py;
             else
               echo 'TELEGRAM_BOT_TOKEN not set; skipping Telegram polling.' && sleep infinity;
             fi"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/cortexcx_db
      OLLAMA_BASE_URL: http://ollama:11434

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    container_name: cortexcx-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_pgvector_data:
  ollama_data:
